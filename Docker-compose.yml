version: '3.8'

services:

  # ── QA Orchestrator Service ──
  qa-orchestrator:
    build: .
    container_name: qa-orchestrator
    ports:
      - "10000:10000"
    environment:
      # Jira
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_COMMENT_ENABLED=${JIRA_COMMENT_ENABLED:-false}

      # LLM Provider — set to: azure | groq | aws | ollama
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}

      # Azure OpenAI (cloud)
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}

      # Groq (cloud, free tier)
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # AWS Bedrock (GovCloud)
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}

      # Ollama (offline — points to ollama container below)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.3}

      # Database — points to postgres container below
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/qaorchestrator
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-qauser}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-qapassword}

    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:15-alpine
    container_name: qa-postgres
    environment:
      - POSTGRES_DB=qaorchestrator
      - POSTGRES_USER=${DB_USERNAME:-qauser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-qapassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qauser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (offline LLM) ──
  # Remove this service if using Azure / Groq / AWS instead
  ollama:
    image: ollama/ollama:latest
    container_name: qa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # GPU support (optional — uncomment if server has NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  ollama_data: