swagger: '2.0'
info:
  title: QA Orchestrator API
  description: AI-powered QA decision engine. Analyzes Jira issues and returns structured QA intelligence.
  version: 3.0.0
host: qa-orchestrator-service.onrender.com
basePath: /
schemes:
  - https

paths:
  /qa/api/v1/qa/analyze:
    post:
      operationId: analyzeQaIssue
      summary: Analyze a Jira issue
      description: Runs the full QA pipeline for a Jira issue.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: QA analysis result
          schema:
            $ref: '#/definitions/QaAnalyzeResponse'

  /qa/run/{issueKey}:
    post:
      operationId: runQaAnalysis
      summary: Run QA analysis (legacy)
      description: Legacy endpoint.
      produces:
        - application/json
      parameters:
        - name: issueKey
          in: path
          required: true
          type: string
      responses:
        '200':
          description: QA analysis result
          schema:
            $ref: '#/definitions/QaAnalyzeResponse'

  /qa/api/v1/intelligence/summary:
    get:
      operationId: getIntelligenceSummary
      summary: Get QA intelligence summary
      description: Returns aggregated intelligence across all analyses.
      produces:
        - application/json
      responses:
        '200':
          description: Intelligence summary
          schema:
            type: object

  /qa/api/v1/intelligence/blocked:
    get:
      operationId: getBlockedTickets
      summary: Get blocked tickets
      produces:
        - application/json
      responses:
        '200':
          description: Blocked analysis records
          schema:
            type: array
            items:
              $ref: '#/definitions/AnalysisRecord'

  /qa/api/v1/intelligence/released:
    get:
      operationId: getReleasedTickets
      summary: Get released tickets with QA summaries
      produces:
        - application/json
      responses:
        '200':
          description: Released analysis records
          schema:
            type: array
            items:
              $ref: '#/definitions/AnalysisRecord'

  /qa/api/v1/intelligence/released/summary:
    get:
      operationId: getReleasedSummaryForCopilot
      summary: Get released tickets summary (Copilot-friendly)
      produces:
        - application/json
      responses:
        '200':
          description: Formatted released tickets summary
          schema:
            type: object
            properties:
              count:
                type: integer
              message:
                type: string
              tickets:
                type: array
                items:
                  type: object

  /qa/api/v1/intelligence/trends:
    get:
      operationId: getRiskTrends
      summary: Get risk trends across re-analyzed issues
      produces:
        - application/json
      responses:
        '200':
          description: Risk trend data
          schema:
            type: array
            items:
              type: object

  /qa/api/v1/intelligence/trends/{issueKey}:
    get:
      operationId: getIssueTrend
      summary: Get risk trend timeline for a specific issue
      produces:
        - application/json
      parameters:
        - name: issueKey
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Issue risk trend timeline
          schema:
            type: object

  /qa/api/v1/intelligence/reanalyzed:
    get:
      operationId: getReanalyzedIssues
      summary: Get most re-analyzed issues
      produces:
        - application/json
      responses:
        '200':
          description: Re-analyzed issues
          schema:
            type: array
            items:
              type: object

  /qa/api/v1/history/{issueKey}:
    get:
      operationId: getIssueHistory
      summary: Get analysis history for a Jira issue
      produces:
        - application/json
      parameters:
        - name: issueKey
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Analysis history
          schema:
            type: array
            items:
              $ref: '#/definitions/AnalysisRecord'

  /qa/api/v1/history:
    get:
      operationId: getRecentHistory
      summary: Get recent analyses
      produces:
        - application/json
      responses:
        '200':
          description: Recent analysis records
          schema:
            type: array
            items:
              $ref: '#/definitions/AnalysisRecord'

  /qa/health:
    get:
      operationId: getHealth
      summary: Health check
      produces:
        - application/json
      responses:
        '200':
          description: Health status
          schema:
            type: object

  /qa/api/v1/agent/requirements:
    post:
      operationId: getRequirements
      summary: Get requirement analysis only
      description: Returns ONLY the requirement analysis for a Jira issue. Use for agent_requirement_analyzer.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: Requirement analysis
          schema:
            type: object
            properties:
              result:
                type: string

  /qa/api/v1/agent/testcases:
    post:
      operationId: getTestCases
      summary: Get test cases only
      description: Returns ONLY test cases for a Jira issue. Use for agent_test_case_generator.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: Test cases
          schema:
            type: object
            properties:
              result:
                type: string

  /qa/api/v1/agent/risk:
    post:
      operationId: getRiskAnalysis
      summary: Get risk analysis only
      description: Returns ONLY the risk analysis for a Jira issue. Use for agent_risk_predictor.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: Risk analysis
          schema:
            type: object
            properties:
              result:
                type: string

  /qa/api/v1/agent/automation:
    post:
      operationId: getAutomationStrategy
      summary: Get automation strategy only
      description: Returns ONLY the automation strategy for a Jira issue. Use for agent_automation_builder.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: Automation strategy
          schema:
            type: object
            properties:
              result:
                type: string

  /qa/api/v1/agent/bugreport:
    post:
      operationId: getBugReport
      summary: Get bug report only
      description: Returns ONLY the bug report for a Jira issue. Use for agent_bug_reporter.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - issueKey
            properties:
              issueKey:
                type: string
      responses:
        '200':
          description: Bug report
          schema:
            type: object
            properties:
              result:
                type: string

definitions:
  QaAnalyzeResponse:
    type: object
    properties:
      output:
        type: string
      analysis:
        $ref: '#/definitions/QaAnalysis'

  QaAnalysis:
    type: object
    properties:
      traceabilityId:
        type: string
      contractVersion:
        type: string
      analysisSummary:
        type: string
      requirementStatus:
        type: string
      featureSummary:
        type: string
      riskLevel:
        type: string
      riskScore:
        type: integer
      releaseRecommendation:
        type: string
      automationRecommendation:
        type: string
      stages:
        $ref: '#/definitions/QaStages'

  QaStages:
    type: object
    properties:
      requirement:
        $ref: '#/definitions/RequirementStage'
      testDesign:
        $ref: '#/definitions/TestDesignStage'
      automation:
        $ref: '#/definitions/AutomationStage'
      risk:
        $ref: '#/definitions/RiskStage'
      bugReport:
        $ref: '#/definitions/BugReportStage'

  RequirementStage:
    type: object
    properties:
      status:
        type: string
      featureSummary:
        type: string
      clarifiedRequirements:
        type: array
        items:
          type: string
      edgeCases:
        type: array
        items:
          type: string
      openQuestions:
        type: array
        items:
          type: string
      scope:
        type: array
        items:
          type: string
      outOfScope:
        type: array
        items:
          type: string

  TestDesignStage:
    type: object
    properties:
      testScenarios:
        type: array
        items:
          type: string
      testCases:
        type: array
        items:
          $ref: '#/definitions/TestCase'

  TestCase:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      preconditions:
        type: string
      steps:
        type: array
        items:
          type: string
      expectedResult:
        type: string
      testType:
        type: string
      suiteTag:
        type: string
      testData:
        type: string
      priority:
        type: string

  AutomationStage:
    type: object
    properties:
      automationRecommendation:
        type: string
      automationReasoning:
        type: string
      coverageSplit:
        type: string
      frameworkSuggestion:
        type: string

  RiskStage:
    type: object
    properties:
      riskScore:
        type: integer
      riskLevel:
        type: string
      riskReason:
        type: string
      topRiskDrivers:
        type: array
        items:
          type: string
      releaseRecommendation:
        type: string

  BugReportStage:
    type: object
    properties:
      title:
        type: string
      environment:
        type: string
      severity:
        type: string
      priority:
        type: string
      reproductionSteps:
        type: array
        items:
          type: string
      expectedResult:
        type: string
      actualResult:
        type: string
      impactSummary:
        type: string
      affectedAreas:
        type: array
        items:
          type: string
      suggestedAssignee:
        type: string

  AnalysisRecord:
    type: object
    properties:
      id:
        type: integer
      issueKey:
        type: string
      featureSummary:
        type: string
      requirementStatus:
        type: string
      riskLevel:
        type: string
      riskScore:
        type: integer
      releaseRecommendation:
        type: string
      automationRecommendation:
        type: string
      testCaseCount:
        type: integer
      analyzedAt:
        type: string
      pipelineDurationMs:
        type: integer
      completedAt:
        type: string
      releaseSummary:
        type: string

securityDefinitions: {}